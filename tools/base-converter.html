<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Base Converter</title>
  <link rel="stylesheet" href="tool-base.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap');

    .base-main {
      font-size: 15.5px;
      line-height: 1.6;
    }

    .base-main h1 {
      font-size: 42px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .converter {
      color: var(--brand);
    }

    .base-layout {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .base-section {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid #e2ecf7;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.04);
    }

    .base-section:first-child {
      margin-top: 2px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #475569;
      text-transform: uppercase;
      display: block;
      margin-bottom: 10px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .field-grid label,
    .swap-row label {
      font-size: 12.5px;
      margin-bottom: 7px;
      color: #1e293b;
      letter-spacing: normal;
    }

    .field-grid input,
    .swap-row select {
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 14.5px;
    }

    .base-select-wrap {
      position: relative;
      border-radius: 16px;
    }

    .base-select-native {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .base-select-trigger {
      width: 100%;
      border: 1px solid #c7d6e6;
      border-radius: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #f5f9ff 100%);
      color: #0f172a;
      font-family: 'Poppins', 'Inter', 'Segoe UI', sans-serif;
      padding: 12px 13px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74), 0 4px 10px rgba(15, 23, 42, 0.04);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .base-select-trigger:hover {
      border-color: #adc3da;
      background: linear-gradient(180deg, #ffffff 0%, #f1f7ff 100%);
    }

    .base-select-wrap[data-open='true'] .base-select-trigger,
    .base-select-trigger:focus-visible {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16), 0 8px 16px rgba(16, 185, 129, 0.14);
      background: linear-gradient(180deg, #ffffff 0%, #f4fbf9 100%);
      transform: translateY(-1px);
      outline: none;
    }

    .base-select-value {
      text-align: left;
      font-weight: 300;
    }

    .base-select-chevron {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid #d5dfeb;
      background: linear-gradient(180deg, #ffffff 0%, #eef4fc 100%);
      position: relative;
      flex: 0 0 auto;
    }

    .base-select-chevron::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 42%;
      width: 6px;
      height: 6px;
      border-right: 2px solid #64748b;
      border-bottom: 2px solid #64748b;
      transform: translate(-50%, -50%) rotate(45deg);
      transition: transform 0.2s ease;
    }

    .base-select-wrap[data-open='true'] .base-select-chevron::before {
      transform: translate(-50%, -20%) rotate(-135deg);
    }

    .base-select-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #dbe7f3;
      border-radius: 16px;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.12);
      padding: 8px;
      display: none;
      z-index: 20;
    }

    .base-select-wrap[data-open='true'] .base-select-menu {
      display: grid;
      gap: 4px;
    }

    .base-select-option {
      border: none;
      margin: 0;
      width: 100%;
      text-align: left;
      border-radius: 12px;
      background: transparent;
      color: #334155;
      font-family: 'Poppins', 'Inter', 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 300;
      padding: 10px 12px;
      box-shadow: none;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .base-select-option:hover,
    .base-select-option:focus-visible {
      background: #eff6f3;
      color: #0f766e;
      outline: none;
    }

    .base-select-option[data-selected='true'] {
      background: #d8ebe4;
      color: #0f766e;
      font-weight: 300;
    }

    .convert-card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: none;
    }

    .base-arrow {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.28);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.08);
      align-self: center;
    }

    .base-arrow-icon {
      width: 18px;
      height: 18px;
      display: block;
      filter: invert(37%) sepia(30%) saturate(1046%) hue-rotate(124deg) brightness(94%) contrast(97%);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .action-row button {
      margin-top: 0;
      font-family: "Poppins";
      font-weight: 600;
      font-size: 14px;
      padding: 12px 14px;
    }

    .action-row .cta-primary {
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.28);
    }

    .action-row .cta-secondary,
    .action-row .cta-ghost {
      background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
      color: #0f172a;
      border: 1px solid #d0dbe8;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .action-row .cta-secondary:hover,
    .action-row .cta-ghost:hover {
      border-color: #b9c8da;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
    }

    .output-value {
      min-height: 76px;
      border: 1px solid #dbe7f3;
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      font-size: clamp(20px, 4.1vw, 24px);
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
      word-break: break-word;
      display: flex;
      align-items: center;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .result-item {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid #dbe7f3;
      border-radius: 12px;
      padding: 12px;
    }

    .result-title {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.35;
      word-break: break-word;
    }

    .note {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d9e4f1;
      background: #f8fbff;
      font-size: 13px;
      color: #64748b;
    }

    .control-stack {
      display: grid;
      gap: 12px;
    }

    .swap-row {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-areas:
        "from"
        "arrow"
        "to";
      gap: 10px;
      align-items: stretch;
    }

    .swap-row > div:first-child {
      grid-area: from;
      min-width: 0;
    }

    .swap-row > div:last-child {
      grid-area: to;
      min-width: 0;
    }

    .swap-row .base-arrow {
      grid-area: arrow;
      margin: 2px auto;
      transform: rotate(90deg);
    }

    @media (min-width: 620px) {
      .field-full {
        grid-column: 1 / -1;
      }

      .swap-row {
        grid-template-columns: 1fr auto 1fr;
        grid-template-areas: "from arrow to";
        gap: 12px;
        align-items: end;
      }

      .swap-row .base-arrow {
        margin: 0;
        transform: none;
      }

      .action-row {
        grid-template-columns: 1fr 1fr;
        margin-top: 10px;
      }

      .result-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a href="../sidepanel.html" class="back-link">&larr; Back to Tools</a>
    </div>

    <section class="card base-main">
      <h1>Base <span class="converter">Converter</span></h1>
      <p>Convert values between binary, decimal, hexadecimal, and octal in a cleaner, smoother workflow.</p>

      <div class="base-layout">
        <div class="base-section">
          <span class="section-label">Convert Value</span>
          <div class="convert-card">
            <div class="field-grid">
              <div class="field-full">
                <label for="valueInput">Number</label>
                <input id="valueInput" type="text" placeholder="101101">
              </div>

              <div class="swap-row">
                <div>
                  <label for="inputBase">CONVERT FROM</label>
                  <div class="base-select-wrap">
                    <select id="inputBase" class="base-select-native" aria-hidden="true" tabindex="-1">
                      <option value="2">Binary</option>
                      <option value="8">Octal</option>
                      <option value="10" selected>Decimal</option>
                      <option value="16">Hexadecimal</option>
                    </select>
                    <button class="base-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="inputBaseMenu">
                      <span class="base-select-value">Decimal</span>
                      <span class="base-select-chevron" aria-hidden="true"></span>
                    </button>
                    <div id="inputBaseMenu" class="base-select-menu" role="listbox" aria-label="Convert from">
                      <button type="button" class="base-select-option" role="option" data-value="2">Binary</button>
                      <button type="button" class="base-select-option" role="option" data-value="8">Octal</button>
                      <button type="button" class="base-select-option" role="option" data-value="10">Decimal</button>
                      <button type="button" class="base-select-option" role="option" data-value="16">Hexadecimal</button>
                    </div>
                  </div>
                </div>

                <div class="base-arrow" aria-hidden="true">
                  <img class="base-arrow-icon" src="../icon/arrow.svg" alt="">
                </div>

                <div>
                  <label for="outputBase">CONVERT TO</label>
                  <div class="base-select-wrap">
                    <select id="outputBase" class="base-select-native" aria-hidden="true" tabindex="-1">
                      <option value="2">Binary</option>
                      <option value="8">Octal</option>
                      <option value="10">Decimal</option>
                      <option value="16" selected>Hexadecimal</option>
                    </select>
                    <button class="base-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="outputBaseMenu">
                      <span class="base-select-value">Hexadecimal</span>
                      <span class="base-select-chevron" aria-hidden="true"></span>
                    </button>
                    <div id="outputBaseMenu" class="base-select-menu" role="listbox" aria-label="Convert to">
                      <button type="button" class="base-select-option" role="option" data-value="2">Binary</button>
                      <button type="button" class="base-select-option" role="option" data-value="8">Octal</button>
                      <button type="button" class="base-select-option" role="option" data-value="10">Decimal</button>
                      <button type="button" class="base-select-option" role="option" data-value="16">Hexadecimal</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="action-row">
              <button id="convertBtn" class="cta-primary" type="button">Convert Value</button>
              <button id="swapBtn" class="cta-secondary" type="button">Swap Bases</button>
            </div>
            <div class="action-row">
              <button id="copyBtn" class="cta-secondary" type="button">Copy Result</button>
              <button id="resetBtn" class="cta-ghost" type="button">Reset Values</button>
            </div>
          </div>
        </div>

        <div class="base-section">
          <span class="section-label">Result</span>
          <div class="output-value" id="primaryOutput">-</div>
          <div class="note" id="status" role="status" aria-live="polite">Enter a value and convert between bases.</div>
        </div>

        <div class="base-section">
          <span class="section-label">All Bases</span>
          <div class="result-grid">
            <div class="result-item">
              <span class="result-title">Binary</span>
              <div class="result-value" id="binaryOutput">-</div>
            </div>
            <div class="result-item">
              <span class="result-title">Decimal</span>
              <div class="result-value" id="decimalOutput">-</div>
            </div>
            <div class="result-item">
              <span class="result-title">Hexadecimal</span>
              <div class="result-value" id="hexOutput">-</div>
            </div>
            <div class="result-item">
              <span class="result-title">Octal</span>
              <div class="result-value" id="octalOutput">-</div>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script src="base-converter.js"></script>
</body>
</html>
