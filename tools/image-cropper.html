<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image Cropper</title>
  <link rel="stylesheet" href="tool-base.css">
  <style>
    .tool-main { font-size: 15.5px; line-height: 1.6; }
    .tool-main h1 { font-size: 40px; line-height: 1.12; margin-bottom: 8px; }
    .accent { color: var(--brand); }
    .layout { display: flex; flex-direction: column; gap: 16px; }
    .panel { background: linear-gradient(180deg, #fff 0%, #f8fbff 100%); border: 1px solid #e2ecf7; border-radius: 14px; padding: 14px; box-shadow: 0 8px 20px rgba(2, 6, 23, 0.04); }
    .section-label { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #475569; text-transform: uppercase; display: block; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .grid label { font-size: 12.5px; margin-bottom: 7px; color: #1e293b; }
    .grid input { border-radius: 12px; padding: 12px 13px; font-size: 14.5px; }
    .action-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
    .action-grid button { margin-top: 0; font-family: 'Poppins'; font-weight: 600; font-size: 14px; padding: 12px 14px; }
    .action-grid .cta-secondary, .action-grid .cta-ghost { background: linear-gradient(180deg, #fff 0%, #f4f7fb 100%); color: #0f172a; border: 1px solid #d0dbe8; box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08); }
    .action-grid .cta-secondary:hover, .action-grid .cta-ghost:hover { border-color: #b9c8da; box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12); }
    .file-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .file-name { font-size: 12px; color: #334155; font-weight: 600; background: linear-gradient(180deg, #fff 0%, #f4f7fb 100%); border: 1px solid #d0dbe8; border-radius: 10px; padding: 10px 12px; min-height: 44px; display: inline-flex; align-items: center; box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08); word-break: break-word; flex: 1 1 220px; }
    .file-input { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .file-btn { display: inline-flex; align-items: center; gap: 10px; border-radius: 12px; border: 1px solid #d0dbe8; background: linear-gradient(180deg, #fff 0%, #f4f7fb 100%); color: #0f172a; font-family: 'Poppins', 'Inter', 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; padding: 6px; cursor: pointer; min-height: 44px; box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08); }
    .file-badge { width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #34d399 0%, #059669 70%); color: #fff; font-size: 16px; font-weight: 700; }
    .preview-wrap { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .preview-stage { position: relative; display: grid; justify-items: center; min-height: 220px; background: #f8fbff; border: 1px dashed #cdd9e8; border-radius: 14px; padding: 12px; overflow: hidden; }
    .preview-image { max-width: 100%; height: auto; display: none; border-radius: 12px; }
    .preview-placeholder { color: #64748b; text-align: center; display: grid; place-items: center; min-height: 190px; }
    .crop-overlay { position: absolute; border: 2px solid rgba(16, 185, 129, 0.95); background: rgba(16, 185, 129, 0.14); box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.28); border-radius: 8px; pointer-events: none; display: none; }
    .preview-meta { color: #64748b; font-size: 13px; }
    .result-image { width: 100%; max-height: 280px; object-fit: contain; display: none; border-radius: 12px; border: 1px solid #dbe7f3; background: #fff; }
    .status { min-height: 20px; margin-top: 10px; font-size: 13px; color: #475569; }
    @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } .action-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar"><a href="../sidepanel.html" class="back-link">&larr; Back to Tools</a></div>
    <section class="card tool-main">
      <h1>Image <span class="accent">Cropper</span></h1>
      <p>Load an image, define the crop area with exact coordinates, and export the cropped result instantly.</p>
      <div class="layout">
        <div class="panel">
          <span class="section-label">Source</span>
          <div class="file-row">
            <label class="file-btn" for="imageInput"><span class="file-badge">+</span><span>Choose image</span></label>
            <input id="imageInput" class="file-input" type="file" accept="image/*">
            <div id="fileName" class="file-name">No file selected</div>
          </div>
        </div>
        <div class="panel">
          <span class="section-label">Crop Settings</span>
          <div class="grid">
            <div><label for="aspectSelect">Preset</label><select id="aspectSelect"><option value="free">Free</option><option value="1:1">Square 1:1</option><option value="4:3">4:3</option><option value="16:9">16:9</option><option value="3:2">3:2</option><option value="5:4">5:4</option></select></div>
            <div><label for="xInput">X position</label><input id="xInput" type="number" min="0" step="1" value="0"></div>
            <div><label for="yInput">Y position</label><input id="yInput" type="number" min="0" step="1" value="0"></div>
            <div><label for="widthInput">Width</label><input id="widthInput" type="number" min="1" step="1" value="1"></div>
            <div><label for="heightInput">Height</label><input id="heightInput" type="number" min="1" step="1" value="1"></div>
          </div>
          <div class="action-grid">
            <button id="centerBtn" class="cta-secondary" type="button">Center Crop</button>
            <button id="cropBtn" class="cta-primary" type="button">Crop Image</button>
            <button id="resetBtn" class="cta-ghost" type="button">Reset</button>
          </div>
        </div>
        <div class="panel">
          <span class="section-label">Preview</span>
          <div class="preview-wrap">
            <div class="preview-stage" id="previewStage">
              <div id="previewPlaceholder" class="preview-placeholder">Load an image to see the crop preview.</div>
              <img id="sourceImage" class="preview-image" alt="Crop preview">
              <div id="cropOverlay" class="crop-overlay"></div>
            </div>
            <div class="preview-meta" id="previewMeta">No image loaded.</div>
            <img id="resultImage" class="result-image" alt="Cropped result preview">
            <button id="downloadBtn" class="cta-secondary" type="button" disabled>Download Crop</button>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="tool-base-footer.js"></script>
  <script src="image-cropper.js"></script>
</body>
</html>
