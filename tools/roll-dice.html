<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Roll the Dice</title>
  <link rel="stylesheet" href="tool-base.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap');

    .dice-main {
      font-size: 15.5px;
      line-height: 1.6;
    }

    .dice-main h1 {
      font-size: 42px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .highlight {
      color: var(--brand);
    }

    .tool-section {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid #e2ecf7;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.04);
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #475569;
      text-transform: uppercase;
      display: block;
      margin-bottom: 10px;
    }

    .dice-layout {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
      align-items: start;
    }

    .dice-stage {
      position: relative;
      min-height: 270px;
      border-radius: 14px;
      border: 1px solid #dbe7f3;
      background:
        radial-gradient(circle at 24% 15%, rgba(16, 185, 129, 0.15), transparent 44%),
        linear-gradient(180deg, #fbfdff 0%, #edf5ff 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1100px;
      perspective-origin: center 28%;
      padding: 14px;
    }

    .dice-shadow {
      position: absolute;
      width: 110px;
      height: 35px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.22) 0%, rgba(15, 23, 42, 0.04) 70%, transparent 100%);
      transform: translateY(86px);
      filter: blur(1px);
      transition: transform 0.45s ease, opacity 0.45s ease;
    }

    .dice-wrap {
      transform-style: preserve-3d;
      transform: rotateX(-14deg) rotateZ(8deg);
    }

    .dice-cube {
      width: 96px;
      height: 96px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx, -24deg)) rotateY(var(--ry, 36deg));
      transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .dice-cube.rolling {
      animation: tumble 1s linear infinite;
    }

    @keyframes tumble {
      0% {
        transform: rotateX(-24deg) rotateY(36deg) rotateZ(0deg);
      }
      25% {
        transform: rotateX(110deg) rotateY(180deg) rotateZ(90deg);
      }
      50% {
        transform: rotateX(230deg) rotateY(360deg) rotateZ(160deg);
      }
      75% {
        transform: rotateX(380deg) rotateY(570deg) rotateZ(230deg);
      }
      100% {
        transform: rotateX(530deg) rotateY(760deg) rotateZ(320deg);
      }
    }

    .dice-face {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      background: linear-gradient(165deg, #ffffff 0%, #f6f9ff 72%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .face-front {
      transform: translateZ(48px);
    }

    .face-back {
      transform: rotateY(180deg) translateZ(48px);
    }

    .face-right {
      transform: rotateY(90deg) translateZ(48px);
    }

    .face-left {
      transform: rotateY(-90deg) translateZ(48px);
    }

    .face-top {
      transform: rotateX(90deg) translateZ(48px);
    }

    .face-bottom {
      transform: rotateX(-90deg) translateZ(48px);
    }

    .pip-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      place-items: center;
    }

    .pip {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: radial-gradient(circle at 32% 30%, #334155 0%, #0f172a 75%);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.25);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .action-grid button {
      margin-top: 0;
      font-family: "Poppins";
      font-weight: 600;
      font-size: 14px;
      padding: 12px 14px;
    }

    .cta-primary {
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.28);
    }

    .cta-secondary {
      background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
      color: #0f172a;
      border: 1px solid #d0dbe8;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .result-card {
      border: 1px solid #dbe7f3;
      border-radius: 12px;
      background: #f8fbff;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .result-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      color: #334155;
      font-size: 13px;
    }

    .result-value {
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      color: #0f172a;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d9e4f1;
      background: #f8fbff;
      font-size: 13px;
    }

    @media (min-width: 580px) {
      .dice-layout {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a href="../sidepanel.html" class="back-link">&larr; Back to Tools</a>
    </div>

    <section class="card dice-main">
      <h1>Roll The <span class="highlight">Dice</span></h1>
      <p>Spin a 3D isometric dice and reveal the final roll result with a smooth game-like animation.</p>

      <div class="tool-section">
        <span class="section-label">Dice Arena</span>
        <div class="dice-layout">
          <div class="dice-stage" aria-label="3D Dice">
            <div id="diceShadow" class="dice-shadow"></div>
            <div class="dice-wrap">
              <div id="diceCube" class="dice-cube" aria-hidden="true">
                <div class="dice-face face-front">
                  <div class="pip-grid">
                    <span class="pip" style="grid-area: 2 / 2;"></span>
                  </div>
                </div>
                <div class="dice-face face-back">
                  <div class="pip-grid">
                    <span class="pip" style="grid-area: 1 / 1;"></span>
                    <span class="pip" style="grid-area: 1 / 3;"></span>
                    <span class="pip" style="grid-area: 2 / 2;"></span>
                    <span class="pip" style="grid-area: 3 / 1;"></span>
                    <span class="pip" style="grid-area: 3 / 3;"></span>
                  </div>
                </div>
                <div class="dice-face face-right">
                  <div class="pip-grid">
                    <span class="pip" style="grid-area: 1 / 1;"></span>
                    <span class="pip" style="grid-area: 1 / 3;"></span>
                    <span class="pip" style="grid-area: 3 / 1;"></span>
                    <span class="pip" style="grid-area: 3 / 3;"></span>
                  </div>
                </div>
                <div class="dice-face face-left">
                  <div class="pip-grid">
                    <span class="pip" style="grid-area: 1 / 1;"></span>
                    <span class="pip" style="grid-area: 1 / 3;"></span>
                    <span class="pip" style="grid-area: 2 / 1;"></span>
                    <span class="pip" style="grid-area: 2 / 3;"></span>
                    <span class="pip" style="grid-area: 3 / 1;"></span>
                    <span class="pip" style="grid-area: 3 / 3;"></span>
                  </div>
                </div>
                <div class="dice-face face-top">
                  <div class="pip-grid">
                    <span class="pip" style="grid-area: 1 / 1;"></span>
                    <span class="pip" style="grid-area: 3 / 3;"></span>
                  </div>
                </div>
                <div class="dice-face face-bottom">
                  <div class="pip-grid">
                    <span class="pip" style="grid-area: 1 / 1;"></span>
                    <span class="pip" style="grid-area: 2 / 2;"></span>
                    <span class="pip" style="grid-area: 3 / 3;"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div>
            <div class="result-card" aria-live="polite">
              <div class="result-line">
                <span>Last Roll</span>
                <strong id="lastResult" class="result-value">1</strong>
              </div>
              <div class="result-line">
                <span>Total Rolls</span>
                <strong id="rollCount">0</strong>
              </div>
              <div class="result-line">
                <span>Average</span>
                <strong id="averageValue">0.00</strong>
              </div>
            </div>

            <div class="action-grid">
              <button id="rollBtn" class="cta-primary" type="button">Roll Dice</button>
              <button id="resetBtn" class="cta-secondary" type="button">Reset</button>
            </div>

            <div id="status" class="status" role="status" aria-live="polite">Tap Roll Dice to start.</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="tool-base-footer.js"></script>
  <script src="roll-dice.js"></script>
</body>
</html>
