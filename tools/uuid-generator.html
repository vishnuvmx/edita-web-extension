<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UUID Generator</title>
  <link rel="stylesheet" href="tool-base.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap');

    html,
    body {
      height: 100%;
    }

    .page {
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
    }

    .uuid-main {
      font-size: 16px;
      line-height: 1.55;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .uuid-main h1 {
      font-size: 40px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .generator {
      color: var(--brand);
    }

    .uuid-layout {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .uuid-section {
      border-top: 1px solid #e0e7ff;
      padding-top: 12px;
    }

    .uuid-section:first-child {
      border-top: none;
      padding-top: 0;
    }

    .section-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #475569;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    .option-row {
      display: flex;
      align-items: center;
      column-gap: 20px;
      row-gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .option-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Poppins', 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #334155;
      font-weight: 500;
      line-height: 1.3;
    }

    .option-item input {
      margin: 0;
      accent-color: var(--brand);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .action-row button {
      margin-top: 0;
      font-family: "Poppins";
      font-weight: 600;
      font-size: 14px;
      padding: 12px 14px;
    }

    .action-row .cta-primary {
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.28);
    }

    .action-row .cta-secondary,
    .action-row .cta-ghost {
      background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
      color: #0f172a;
      border: 1px solid #d0dbe8;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .action-row .cta-secondary:hover,
    .action-row .cta-ghost:hover {
      border-color: #b9c8da;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
    }

    @media (min-width: 620px) {
      .action-row {
        grid-template-columns: 1fr 1fr;
        margin-top: 10px;
      }
    }

    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-height: 180px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a href="../sidepanel.html" class="back-link">&larr; Back to Tools</a>
    </div>

    <section class="card uuid-main">
      <h1>UUID <span class="generator">Generator</span></h1>
      <p>Generate RFC 4122 v4 UUID values in one click and copy them in bulk.</p>

      <div class="uuid-layout">
        <div class="uuid-section">
          <span class="section-label">Settings</span>
          <label for="uuidCount">How many UUIDs</label>
          <input id="uuidCount" type="number" min="1" max="100" value="5">

          <div class="option-row">
            <label class="option-item" for="uppercaseToggle">
              <input id="uppercaseToggle" type="checkbox">
              Uppercase output
            </label>
            <label class="option-item" for="hyphenToggle">
              <input id="hyphenToggle" type="checkbox" checked>
              Keep hyphens
            </label>
          </div>

          <div class="action-row">
            <button id="generateBtn" class="cta-primary" type="button">Generate UUIDs</button>
            <button id="copyBtn" class="cta-secondary" type="button">Copy All</button>
          </div>
        </div>

        <div class="uuid-section">
          <span class="section-label">Output</span>
          <label for="uuidOutput">UUID list</label>
          <textarea id="uuidOutput" readonly placeholder="Your UUIDs will appear here..."></textarea>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="uuid-generator.js"></script>
</body>
</html>
