<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Markdown to Excel</title>
  <link rel="stylesheet" href="tool-base.css">
  <style>
    .mdexcel-main { font-size: 15.5px; line-height: 1.6; }
    .mdexcel-main h1 { font-size: 40px; line-height: 1.12; margin-bottom: 8px; }
    .accent { color: var(--brand); }
    .layout { display: flex; flex-direction: column; gap: 16px; }
    .panel { background: linear-gradient(180deg, #fff 0%, #f8fbff 100%); border: 1px solid #e2ecf7; border-radius: 14px; padding: 14px; box-shadow: 0 8px 20px rgba(2, 6, 23, 0.04); }
    .section-label { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #475569; text-transform: uppercase; display: block; margin-bottom: 10px; }
    textarea { width: 100%; min-height: 180px; border: 1px solid #d2deeb; border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.5; font-family: Consolas, 'Courier New', monospace; resize: vertical; background: linear-gradient(180deg, #fff 0%, #f8fbff 100%); color: #0f172a; }
    textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18); }
    .actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
    .actions button { margin-top: 0; font-family: 'Poppins'; font-weight: 600; font-size: 14px; padding: 12px 14px; }
    .actions .cta-secondary, .actions .cta-ghost { background: linear-gradient(180deg, #fff 0%, #f4f7fb 100%); color: #0f172a; border: 1px solid #d0dbe8; box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08); }
    .actions .cta-secondary:hover, .actions .cta-ghost:hover { border-color: #b9c8da; box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12); }
    .option-row { margin-top: 10px; }
    .option-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #334155; }
    .option-toggle input { width: 16px; height: 16px; accent-color: var(--brand); }
    @media (min-width: 620px) { .actions { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar"><a href="../sidepanel.html" class="back-link">&larr; Back to Tools</a></div>
    <section class="card mdexcel-main">
      <h1>Markdown to <span class="accent">Excel</span></h1>
      <p>Extract Markdown tables into rows and download an Excel-compatible file in one click.</p>

      <div class="layout">
        <div class="panel">
          <span class="section-label">Input</span>
          <label for="markdownInput">Markdown text</label>
          <textarea id="markdownInput" placeholder="| Name | Score | City |&#10;| :--- | ---: | :---: |&#10;| Asha | 91 | Kochi |&#10;| Nikhil | 88 | Calicut |"></textarea>
          <div class="option-row">
            <label class="option-toggle" for="removeCites">
              <input id="removeCites" type="checkbox" checked>
              Remove citation tags like [cite:6] and [cite:{12}]
            </label>
          </div>
          <div class="actions">
            <button id="convertBtn" class="cta-primary" type="button">Convert</button>
            <button id="downloadBtn" class="cta-secondary" type="button">Download Excel (.xls)</button>
            <button id="copyCsvBtn" class="cta-secondary" type="button">Copy CSV</button>
            <button id="clearBtn" class="cta-ghost" type="button">Clear</button>
          </div>
        </div>

        <div class="panel">
          <span class="section-label">Output</span>
          <label for="csvOutput">CSV preview</label>
          <textarea id="csvOutput" readonly placeholder="CSV output appears here..."></textarea>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="tool-base-footer.js"></script>
  <script src="markdown-to-excel.js"></script>
</body>
</html>
