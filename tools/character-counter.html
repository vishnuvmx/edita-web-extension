<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Character Counter</title>
  <link rel="stylesheet" href="tool-base.css">
  <style>
    .text-tool-main {
      font-size: 15.5px;
      line-height: 1.6;
    }

    .text-tool-main h1 {
      font-size: 42px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .tool-section {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid #e2ecf7;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.04);
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #475569;
      text-transform: uppercase;
      display: block;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 14px;
      font-family: monospace;
      border: 1px solid #e2ecf7;
      resize: vertical;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid #dbe7f3;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .action-row button {
      margin-top: 0;
      font-family: "Poppins";
      font-weight: 600;
      font-size: 14px;
      padding: 12px 14px;
    }

    .action-row .cta-primary {
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.28);
    }

    .action-row .cta-secondary {
      background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
      color: #0f172a;
      border: 1px solid #d0dbe8;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .action-row .cta-secondary:hover {
      border-color: #b9c8da;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a href="../sidepanel.html" class="back-link">&larr; Back to Tools</a>
    </div>

    <section class="card text-tool-main">
      <h1>Character <span style="color: var(--brand);">Counter</span></h1>
      <p>Analyze your text with detailed character, digit, and symbol counts.</p>

      <div class="tool-section">
        <span class="section-label">Text Input</span>
        <textarea id="textInput" placeholder="Paste or type your text here..."></textarea>

        <div class="action-row">
          <button id="copyBtn" class="cta-primary" type="button">Copy Stats</button>
          <button id="clearBtn" class="cta-secondary" type="button">Clear Text</button>
        </div>
      </div>

      <div class="tool-section">
        <span class="section-label">Character Analysis</span>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Chars</div>
            <div class="stat-value" id="totalCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Spaces</div>
            <div class="stat-value" id="spaceCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Letters</div>
            <div class="stat-value" id="letterCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Digits</div>
            <div class="stat-value" id="digitCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Symbols</div>
            <div class="stat-value" id="symbolCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Lines</div>
            <div class="stat-value" id="lineCount">0</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="tool-base-footer.js"></script>
  <script src="character-counter.js"></script>
</body>
</html>
