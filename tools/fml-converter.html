<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FML Converter</title>
  <link rel="stylesheet" href="tool-base.css">
  <style>
    html,
    body {
      height: 100%;
    }

    .page {
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
    }

    .fml-main {
      font-size: 16px;
      line-height: 1.55;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .fml-main h1 {
      font-size: 40px;
      line-height: 1.08;
      margin-bottom: 8px;
    }

    .converter {
      color: var(--brand);
    }

    .fml-layout {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .fml-section {
      border-top: 1px solid #e0e7ff;
      padding-top: 12px;
    }

    .fml-section:first-child {
      border-top: none;
      padding-top: 0;
    }

    .section-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #475569;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-height: 120px;
      resize: none;
      overflow: hidden;
      line-height: 1.5;
      font-family: Consolas, "Courier New", monospace;
    }

    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 560px) {
      .action-row {
        grid-template-columns: 1fr;
      }
    }

    .action-row button {
      margin-top: 0;
      font-family: "Poppins";
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a href="../sidepanel.html" class="back-link">&larr; Back to Tools</a>
    </div>

    <section class="card fml-main">
      <h1>FML <span class="converter">Converter</span></h1>
      <p>Malayalam Unicode Font to ML TT Font converter. Enter Malayalam text and get exact keyboard code output (example: മലയാളം -> aebmfw).</p>

      <div class="fml-layout">
        <div class="fml-section">
          <span class="section-label">Malayalam Input</span>
          <label for="malayalamInput">Unicode Malayalam text</label>
          <textarea id="malayalamInput" placeholder="മലയാളം ഇവിടെ എഴുതുക"></textarea>

          <div class="action-row">
            <button id="convertBtn" type="button">Convert</button>
            <button id="copyBtn" type="button">Copy Output</button>
            <button id="clearBtn" type="button">Clear</button>
          </div>
        </div>

        <div class="fml-section">
          <span class="section-label">FML / ML TT Output</span>
          <label for="fmlOutput">Keyboard text output</label>
          <textarea id="fmlOutput" readonly placeholder="Converted output appears here..."></textarea>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="fml-converter.js"></script>
</body>
</html>
