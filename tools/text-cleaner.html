<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Text Cleaner</title>
  <link rel="stylesheet" href="tool-base.css">
  <style>
    .text-tool-main {
      font-size: 15.5px;
      line-height: 1.6;
    }

    .text-tool-main h1 {
      font-size: 42px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .tool-section {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid #e2ecf7;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.04);
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #475569;
      text-transform: uppercase;
      display: block;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 14px;
      font-family: monospace;
      border: 1px solid #e2ecf7;
      resize: vertical;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .button-grid button {
      margin-top: 0;
      font-family: "Poppins";
      font-weight: 600;
      font-size: 14px;
      padding: 12px 14px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .action-row button {
      margin-top: 0;
      font-family: "Poppins";
      font-weight: 600;
      font-size: 14px;
      padding: 12px 14px;
    }

    .action-row .cta-primary {
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.28);
    }

    .action-row .cta-secondary {
      background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
      color: #0f172a;
      border: 1px solid #d0dbe8;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .action-row .cta-secondary:hover {
      border-color: #b9c8da;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a href="../sidepanel.html" class="back-link">&larr; Back to Tools</a>
    </div>

    <section class="card text-tool-main">
      <h1>Text <span style="color: var(--brand);">Cleaner</span></h1>
      <p>Clean and normalize your text with various cleaning options.</p>

      <div class="tool-section">
        <span class="section-label">Input Text</span>
        <textarea id="inputText" placeholder="Paste text to clean..."></textarea>

        <div class="button-grid">
          <button type="button" data-clean="trim">Trim Spaces</button>
          <button type="button" data-clean="blank">Remove Blank Lines</button>
          <button type="button" data-clean="extra">Remove Extra Spaces</button>
          <button type="button" data-clean="special">Remove Special Chars</button>
          <button type="button" data-clean="numbers">Remove Numbers</button>
          <button type="button" data-clean="newlines">Single Line</button>
        </div>
      </div>

      <div class="tool-section">
        <span class="section-label">Output</span>
        <textarea id="outputText" placeholder="Cleaned text will appear here..." readonly></textarea>
        <div class="action-row">
          <button id="copyBtn" class="cta-primary" type="button">Copy Output</button>
          <button id="clearBtn" class="cta-secondary" type="button">Clear All</button>
        </div>
      </div>
    </section>
  </main>

  <script src="tool-base-footer.js"></script>
  <script src="text-cleaner.js"></script>
</body>
</html>
